
name: Atualizar EPA Brasileirão

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-epa-brasileirao
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar e calcular quatro temporadas
        run: python fotmob_epa.py --seasons 2026,2025,2024,2023

      - name: Gerar projeção do Brasileirão
        run: python brasileirao_proj.py --season 2026 --sims 5000

      - name: Publicar JSONs atualizados
        run: |
          git config user.name "epa-bot"
          git config user.email "epa-bot@users.noreply.github.com"
          git add docs/data/brasileirao-2026.json docs/data/brasileirao-2025.json docs/data/brasileirao-2024.json docs/data/brasileirao-2023.json docs/projecao-brasileirao.json
          git diff --cached --quiet || (git commit -m "Atualiza EPA e projeção Brasileirão" && git push)
